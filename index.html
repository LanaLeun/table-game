<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прокат настольных игр</title>
</head>

<body>
    <h1>Прокат настольных игр</h1>
    <ul id="gameList"></ul>

    <label for="gameSelect">Игра</label>
    <select id="gameSelect">
        <option value="0">Каркассон</option>
        <option value="1">Доббль</option>
        <option value="2">Шахматы</option>
    </select>

    <label for="borrowerName">Имя посетителя</label>
    <input id="borrowerName" type="text">
    <button id="borrowButton" type="button">Выдать</button>
    <button id="returnButton" type="button">Вернуть</button>
    <p id="message"></p>
    <script>
        const gameList = document.getElementById('gameList')
        const gameSelect = document.getElementById('gameSelect')
        const borrowerName = document.getElementById('borrowerName')
        const borrowButton = document.getElementById('borrowButton')
        const returnButton = document.getElementById('returnButton')
        const message = document.getElementById('message')

        const games = [
            { title: "Каркассон", players: 4, borrower: null },
            { title: "Доббль", players: 6, borrower: 'Аня' },
            { title: "Шахматы", players: 2, borrower: null },
        ]
        function rendergames() {
            gameList.innerHTML = ""

            games.forEach((game) => {
                const item = document.createElement('li')
                if (game.borrower === null) {
                    item.textContent = `${game.title} · ${game.players} · Свободна`
                } else {
                    item.textContent = `${game.title} · ${game.players} · Взял(а): ${game.borrower}`
                }
                gameList.append(item);
            })
        }
        rendergames()

        function getSelectedGame() {
                return games[Number(gameSelect.value)];
            }

        borrowButton.addEventListener('click', () => {
            const ngames = gameSelect.value
            const index = Number(ngames)

            if (isNaN(index) || index < 0 || index >= games.length) {
                alert('Некорректный выбор игры');
                return;
            }

            const game = getSelectedGame();
            const borname = borrowerName.value.trim()
            if (borname === '') {
                message.textContent = "Введите имя"
            } else if (game.borrower !== null) {
                message.textContent = "Игра уже выдана"
            } else {
                game.borrower = borname
                message.textContent = "Игра выдана"
                rendergames()
            }
        })

        returnButton.addEventListener('click', () => {
            const game = getSelectedGame();
            if (game.borrower !== null){
                game.borrower = null
                message.textContent = "Игра возвращена"
                rendergames()
            } else {
                message.textContent = "Игра уже свободна"
            }
        })
    </script>
</body>

</html>
